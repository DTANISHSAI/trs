<!DOCTYPE html>
<html>
<head>
<title>Header</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #f2f6f9; /* light background behind header */
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;   /* center the header horizontally */
        align-items: flex-start;
        height: 100%;
    }

    .header-box {
        margin-top: 15px;                 /* creates separation from top */
        padding: 20px 40px;
        background: linear-gradient(135deg, #2980b9, #6dd5fa);
        color: white;
        border-radius: 22px;              /* curved edges */
        width: 90%;                       /* controls width of box */
        text-align: center;
        box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
    }

    .header-box h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 1px;
    }
</style>
</head>

<body>
    <div class="header-box">
        <h1>Train Reservation System - (TRS)</h1>
    </div>
</body>

</html>
