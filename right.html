<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            position: relative;
            width: 1250px;
            height: 390px;
        }

        .welcome-text {
            position: absolute;
            top: 40px;       /* distance from top of image */
            left: 40px;      /* distance from left of image */
            color: f2f6f9;
            font-family: Arial;
            font-size: 28px;
            text-shadow: 2px 2px 6px black; /* makes text readable on image */
        }

        .sub-text {
            position: absolute;
            top: 90px;
            left: 40px;
            color: f2f6f9;
            font-family: Arial;
            font-size: 18px;
            text-shadow: 2px 2px 6px black;
        }
    </style>
</head>

<body style="margin:0; padding:40px; font-family:'Poppins',sans-serif; background:#ecf0f1;">

    <div style="position:relative; width:100%; height:10%;">
        <img src="Background.webp"
     style="width:99%; height:10%; border-radius:25px;">

        
     <div style="
     position:absolute;
     top:35%;
     left:50%;
     transform:translate(-50%, -50%);
     background: rgba(255,255,255,0.06);
     backdrop-filter: blur(3px);
     -webkit-backdrop-filter: blur(3px);
     width:360px;
     padding:30px 40px;
     border-radius:32px;
     border:1px solid rgba(255,255,255,0.18);
     box-shadow: 0px 4px 14px rgba(0,0,0,0.10);
     text-align:center;
     color:white;
     text-shadow:0px 0px 6px rgba(0,0,0,0.6);
 ">
 
            <h2>Welcome to Train Reservation System - (TRS)</h2>
            <p>Select an option from the left to continue.</p>
        </div>
    </div>
    
    </body>
    


</html>
