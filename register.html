<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>

<body style="
    margin:0;
    height:100vh;
    font-family:Arial;
    background-image:url('trs2.jpg');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
">

<div style="
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(3px) ;
    width:360px;
    padding:30px 40px;
    border-radius:32px;
    border:1px solid rgba(255,255,255,0.18);
    box-shadow: 0px 4px 14px rgba(0,0,0,0.10);
    text-align:center;
    color:white;
">

        <h2>User Registration</h2>

        <form>
            Username:<br>
            <input type="text" required style="width:90%; padding:6px;"><br><br>

            Password:<br>
            <input type="password" required style="width:90%; padding:6px;"><br><br>

            Confirm Password:<br>
            <input type="password" required style="width:90%; padding:6px;"><br><br>

            Email ID:<br>
            <input type="email" required style="width:90%; padding:6px;"><br><br>

            Mobile Number:<br>
            <input type="text" maxlength="10" required style="width:90%; padding:6px;"><br><br>

            Date of Birth:<br>
            <input type="date" required style="width:90%; padding:6px;"><br><br>

            Address:<br>
            <textarea required style="width:90%; padding:6px;"></textarea><br><br>

            Gender:<br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other<br><br>

            <input type="submit" value="Register">
        </form>

    </div>

</body>
</html>
