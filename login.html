<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body style="
    margin:0;
    height:100vh;
    font-family:Arial;
    background-image:url('trs1.jpg');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
">

<div style="
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(3px) ;
    width:360px;
    padding:30px 40px;
    border-radius:32px;
    border:1px solid rgba(255,255,255,0.18);
    box-shadow: 0px 4px 14px rgba(0,0,0,0.10);
    text-align:center;
    color:white;
">



        <h2>Login</h2>

        <form>
            Username:<br>
            <input type="text" required style="width:90%; padding:6px;"><br><br>

            Password:<br>
            <input type="password" required style="width:90%; padding:6px;"><br><br>

            <input type="submit" value="Login"><br><br>

            <a href="forgot.html" target="rightFrame"
   style="
      display:inline-block;
      margin-top:10px;
      padding:6px 18px;
      background:rgba(255,255,255,0.85);
      color:black;
      text-decoration:none;
      border-radius:6px;
      font-size:14px;
   ">
   Forgot Password
</a>
<br><br>

<a href="register.html" target="rightFrame"
   style="
      display:inline-block;
      padding:6px 18px;
      background:rgba(255,255,255,0.85);
      color:black;
      text-decoration:none;
      border-radius:6px;
      font-size:14px;
   ">
   New User? Sign Up
</a>

        </form>

    </div>

</body>
</html>
